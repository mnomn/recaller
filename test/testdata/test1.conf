[[routes]]
# Simplest routing, re-post identical body to another URL"
in="/test10"
out="http://acme.org/out10"

[[trigger]]
name = "atNoon"
type = "clock"
time = "12:00"

[[action]]
name = "postOn"
type = "http"
method = "POST"
url = "http://localhost:8910/on"

[[trigger-actions]]
name = "atNoonPostOn"
trigger = "atNoon"
actions = ["postOn"]